<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date Interval - Bootstrap 5 + jQuery</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { padding: 20px; }
    .result-box {
      background-color: #0d6efd;
      color: white;
      padding: 15px;
      margin-top: 20px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <h3>Date Interval</h3>

  <div class="mb-3">
    <label for="fromDate" class="form-label">From:</label>
    <input type="date" id="fromDate" class="form-control">
  </div>

  <div class="mb-3">
    <label for="toDate" class="form-label">To:</label>
    <input type="date" id="toDate" class="form-control">
  </div>

  <button id="calculateBtn" class="btn btn-primary">Calculate</button>

  <div id="result" class="result-box" ></div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function(){

  $('#calculateBtn').click(function(){
    let startVal = $('#fromDate').val();
    let endVal = $('#toDate').val();

    if (!startVal || !endVal) {
      alert("Please select both dates.");
      return;
    }

    let start = new Date(startVal);
    let end = new Date(endVal);

    if (end < start) {
      alert("End date must be after start date.");
      return;
    }

    let diffMs = end - start; // milliseconds difference
    let diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    let diffWeeks = Math.floor(diffDays / 7);
    let diffMonths = Math.floor(diffDays / 30.4375); // average month length
    let diffYears = Math.floor(diffDays / 365.25);   // average year length

    let output = `
      Date interval between ${start.toLocaleDateString()} and ${end.toLocaleDateString()}<br>
      In years : ${diffYears}<br>
      In months : ${diffMonths}<br>
      In weeks : ${diffWeeks}<br>
      In days : ${diffDays}
    `;

    $("#result").html(output).fadeIn();

   
  });

});
</script>

</body>
</html>
