<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appointment Details</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="IMAGES/APPOINTLY_logo.png"
    />
    <link

    />
  </head>
  <body >

      <h4 class="mt-3">Patient Details</h4>
      <table class="table">

            <th>Name</th>
            <th>Email</th>

            <th>Date</th>

    <script src="JAVASCRIPT/appointmentHandler.js"></script>

      window.onload = function () {
        display();
      };
    </script>
